<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programação</title>
</head>
     <section>
    <h1>Interesse em participar</h1>
<nav>
    <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="programacao.html">Programação</a></li>
        <li><a href="inscricao.html">Inscrição</a></li>
    </ul>
</nav>
        <form action="#">
        <fieldset>
                <legend><strong>Inscrição</strong></legend>
        <p>Preencha os dados para registrar interesse nas atividades da Estação Horizonte Cultural</p>

        <label for="name">Nome completo: </label>
        <input type="text" id="name" placeholder="Nome completo" required><br><br>
  
        <label for="email">Email: </label>
        <input type="email" id="email" placeholder="xxxxxx@gmail.com" required><br><br>
  
        <label for="number">Celular: </label>
        <input type="tel" id="number" placeholder="xx-xxxxx-xxxx" pattern="[0-9](2)-[0-9](5)-[0-9](4)" required>
        <br><br>

        <label for="atividade">Atividade de interesse:</label>
        <br>
        <select id="atividade">
            <option value="fotografia">Fotografia no cotidiano</option>
            <option value="web">Introdução à criação de páginas Web</option>
            <option value="leitura">Clube de leitura – Narrativas brasileiras</option>
            <option value="desenho">Oficina de desenho de observação</option>
            <option value="jogos">Encontro de jogos de tabuleiro</option>
        </select><br><br>

        <label for="idade">Faixa etária:</label><br>
        <select id="idade">
            <option value="idade1">até 15 anos</option>
            <option value="idade2">16 a 20 anos</option>
            <option value="idade3">21 a 40 anos</option>
            <option value="idade4">41 a 60 anos</option>
            <option value="idade5">acima de 60 anos</option>
            </select><br><br>

        <label for="Confirmação">Já participou de alguma atividade da Estação Horizonte Cultural?</label>
        <select id="Confirmação">
            <option value="yes">Sim</option>
            <option value="no">Não</option>
                </select><br><br>

                Observações:<br>
                <textarea name="obs" id="obs" cols="40" rows="6" 
                placeholder="Mensagem ou observaçãos:"></textarea><br>
        <br>
        <button>Enviar</button>

        </fieldset>
        </form>
    </section>
        <footer>
            <small>Estação Horizontal - Todos os direitos reservados. </small>
        </footer>

</body>
</html>
